name: NLM-41 design vendor proof

on:
  push:
    branches: [feat/nlm-41-design-vendor]
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_design_vendor.py'
      - 'tests/test_sync.py'
      - 'scripts/vendor_design_skill.py'
      - 'scripts/vaoferi_sync.py'
      - 'vendor/**'
      - '.github/workflows/nlm41-vendor-proof.yml'

permissions:
  contents: read

jobs:
  design-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Start Here
        uses: actions/checkout@v7
      - name: Checkout canonical design source
        uses: actions/checkout@v7
        with:
          repository: vaoferi/vaoferi-design-skill
          ref: 81f1f59b379fe366cafb3ab56d84ad4cbf1b662c
          path: _design
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Generate pinned design snapshot
        run: python scripts/vendor_design_skill.py --source _design --commit 81f1f59b379fe366cafb3ab56d84ad4cbf1b662c --version 0.3.2
      - name: Run full Start Here test suite
        run: python -m unittest discover -s tests -v
      - name: Check compact universal contract
        run: python scripts/check_agents_contract.py AGENTS.md
      - name: Upload generated vendor snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nlm41-design-vendor
          path: |
            vendor/design-skill.lock.json
            vendor/vaoferi-design-skill
