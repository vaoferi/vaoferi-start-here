name: Trello retirement policy proof

on:
  push:
    branches: [fix/trello-retirement-hard-delete]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_agents_contract -v
      - run: python scripts/check_agents_contract.py AGENTS.md
