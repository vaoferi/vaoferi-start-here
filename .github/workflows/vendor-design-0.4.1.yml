name: Vendor Design Skill 0.4.1

on:
  push:
    branches:
      - release/0.2.0-project-adaptation
    paths:
      - .github/workflows/vendor-design-0.4.1.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Start Here branch
        uses: actions/checkout@v7
        with:
          ref: release/0.2.0-project-adaptation
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Checkout canonical Design Skill
        uses: actions/checkout@v7
        with:
          repository: vaoferi/vaoferi-design-skill
          ref: 264991d7a6c79322b39567391634f1045ccb170d
          path: .tmp-design-source
          fetch-depth: 1
      - name: Generate exact vendored snapshot and lock
        run: >-
          python scripts/vendor_design_skill.py
          --source .tmp-design-source
          --commit 264991d7a6c79322b39567391634f1045ccb170d
          --version 0.4.1
      - name: Remove temporary source checkout
        run: rm -rf .tmp-design-source
      - name: Commit generated vendor snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/design-skill.lock.json vendor/vaoferi-design-skill
          git diff --cached --check
          git commit -m 'vendor: pin Vaoferi Design Skill 0.4.1'
          git push origin HEAD:release/0.2.0-project-adaptation
