name: NLM-42 SteelSales rule parity proof

on:
  push:
    branches: [feat/nlm-42-steel-sales-rule-parity]

permissions:
  contents: read

jobs:
  rule-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run Start Here contract tests
        run: python -m unittest tests.test_agents_contract -v
      - name: Check compact universal contract
        run: python scripts/check_agents_contract.py AGENTS.md
